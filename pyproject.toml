[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "own-commerce-data-agent"
version = "0.1.0"
description = "自主电商语义查询与证据驱动 Data Agent"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6", "pydantic==2.14.0", "sqlglot==30.22.0", "langgraph==1.2.14", "httpx==0.28.1", "mcp==1.30.0"]

[project.scripts]
own-agent = "local_agent.cli:main"
own-agent-mcp = "local_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["local_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
